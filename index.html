<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12151c">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="66 天習慣養成,離線可用。">

  <!-- iOS home-screen behaviour -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reset66">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="stylesheet" href="./styles.css">
  <title>Reset66</title>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">Reset66</h1>
    <span id="net-status" class="pill" aria-live="polite" hidden></span>
  </header>

  <main id="app" class="app-main"></main>

  <nav id="tabbar" class="tabbar" aria-label="主要導覽" hidden>
    <a href="#/today" data-route="today">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><polyline points="8,12.5 11,15.5 16.5,9.5"/></svg>
      <span>今日</span>
    </a>
    <a href="#/habits" data-route="habits">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="9" y1="7" x2="20" y2="7"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="17" x2="20" y2="17"/><circle cx="4.5" cy="7" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="17" r="1"/></svg>
      <span>習慣</span>
    </a>
    <a href="#/settings" data-route="settings">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.5" fill="var(--bg)"/><circle cx="15" cy="17" r="2.5" fill="var(--bg)"/></svg>
      <span>設定</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="card">需要啟用 JavaScript 才能使用 Reset66。</p></noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
